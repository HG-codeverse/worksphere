{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Projects</h2>

    <a href="{{ url_for('projects.create') }}" class="btn btn-success mb-3">
        + New Project
    </a>

    <table class="table table-bordered">

        <thead>

            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Created</th>
            </tr>

        </thead>

        <tbody>

        {% for project in projects %}

            <tr>

                <td>{{ project.name }}</td>

                <td>{{ project.status }}</td>

                <td>{{ project.created_at.strftime("%d-%m-%Y") }}</td>

            </tr>

        {% else %}

            <tr>
                <td colspan="3" class="text-center">
                    No Projects Found
                </td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
